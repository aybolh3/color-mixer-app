<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorMix Studio</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lang-select {
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .color-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 1px solid #ddd;
        }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-cap {
            background: #e0e0e0;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .cap-count {
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .preview-box {
            height: 80px;
            border-radius: 10px;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #777;
            margin-top: 15px;
            transition: background 0.3s;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="app-title">مزج الألوان (ColorMix)</h2>
        <select class="lang-select" id="lang-switcher" onchange="changeLanguage(this.value)">
            <option value="ar" selected>العربية</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="card">
        <h3 id="section-title">أغطية القنينات (Bottle Caps)</h3>
        
        <!-- أزرق -->
        <div class="color-row">
            <div class="color-info">
                <div class="color-dot" style="background: #0000ff;"></div>
                <span class="color-label" data-ar="أزرق" data-fr="Bleu" data-en="Blue">أزرق</span>
            </div>
            <div class="counter-controls">
                <button class="btn-cap" onclick="updateCount('blue', -1)">-</button>
                <span class="cap-count" id="count-blue">0</span>
                <button class="btn-cap" onclick="updateCount('blue', 1)">+</button>
            </div>
        </div>

        <!-- أصفر -->
        <div class="color-row">
            <div class="color-info">
                <div class="color-dot" style="background: #ffff00;"></div>
                <span class="color-label" data-ar="أصفر" data-fr="Jaune" data-en="Yellow">أصفر</span>
            </div>
            <div class="counter-controls">
                <button class="btn-cap" onclick="updateCount('yellow', -1)">-</button>
                <span class="cap-count" id="count-yellow">0</span>
                <button class="btn-cap" onclick="updateCount('yellow', 1)">+</button>
            </div>
        </div>

        <!-- أحمر -->
        <div class="color-row">
            <div class="color-info">
                <div class="color-dot" style="background: #ff0000;"></div>
                <span class="color-label" data-ar="أحمر" data-fr="Rouge" data-en="Red">أحمر</span>
            </div>
            <div class="counter-controls">
                <button class="btn-cap" onclick="updateCount('red', -1)">-</button>
                <span class="cap-count" id="count-red">0</span>
                <button class="btn-cap" onclick="updateCount('red', 1)">+</button>
            </div>
        </div>

        <!-- أبيض -->
        <div class="color-row">
            <div class="color-info">
                <div class="color-dot" style="background: #ffffff;"></div>
                <span class="color-label" data-ar="أبيض" data-fr="Blanc" data-en="White">أبيض</span>
            </div>
            <div class="counter-controls">
                <button class="btn-cap" onclick="updateCount('white', -1)">-</button>
                <span class="cap-count" id="count-white">0</span>
                <button class="btn-cap" onclick="updateCount('white', 1)">+</button>
            </div>
        </div>

        <div class="preview-box" id="result-preview">
            <span id="preview-text">النتيجة ستظهر هنا</span>
        </div>
    </div>

    <script>
        const counts = { blue: 0, yellow: 0, red: 0, white: 0 };
        const rgbColors = {
            blue: [0, 0, 255],
            yellow: [255, 255, 0],
            red: [255, 0, 0],
            white: [255, 255, 255]
        };

        function updateCount(color, change) {
            if (counts[color] + change >= 0) {
                counts[color] += change;
                document.getElementById(`count-${color}`).innerText = counts[color];
                calculateMix();
            }
        }

        function calculateMix() {
            let totalCaps = counts.blue + counts.yellow + counts.red + counts.white;
            const preview = document.getElementById('result-preview');
            const text = document.getElementById('preview-text');

            if (totalCaps === 0) {
                preview.style.background = 'transparent';
                text.style.display = 'block';
                return;
            }

            text.style.display = 'none';
            let r = Math.round((counts.red * 255 + counts.yellow * 255 + counts.white * 255) / totalCaps);
            let g = Math.round((counts.yellow * 255 + counts.white * 255) / totalCaps);
            let b = Math.round((counts.blue * 255 + counts.white * 255) / totalCaps);

            preview.style.background = `rgb(${r}, ${g}, ${b})`;
        }

        function changeLanguage(lang) {
            document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            const titles = {
                ar: { app: "مزج الألوان (ColorMix)", section: "أغطية القنينات (Bottle Caps)", preview: "النتيجة ستظهر هنا" },
                fr: { app: "Mélangeur de Couleurs", section: "Bouchons de Bouteilles", preview: "Le résultat apparaîtra ici" },
                en: { app: "ColorMixer Studio", section: "Bottle Caps Counter", preview: "Result will appear here" }
            };

            document.getElementById('app-title').innerText = titles[lang].app;
            document.getElementById('section-title').innerText = titles[lang].section;
            document.getElementById('preview-text').innerText = titles[lang].preview;

            document.querySelectorAll('.color-label').forEach(el => {
                el.innerText = el.getAttribute(`data-${lang}`);
            });
        }
    </script>
</body>
</html>
