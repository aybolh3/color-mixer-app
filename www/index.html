<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColorMixer Studio</title>

  <!-- السطر الأساسي لتشغيل Cordova على أجهزة Android -->
  <script src="cordova.js"></script>

  <style>
    /* التنسيق الخاص بالشارة المائية في الخلفية */
    html::before {
      content: 'CodePen ♥ The Web';
      position: fixed;
      inset: 0;
      z-index: -1;
      margin: auto;
      width: fit-content;
      height: fit-content;
      font-family: monospace;
      opacity: 0.6;
      background: rebeccapurple;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      max-width: 380px;
      width: 90%;
    }

    h1 {
      margin-top: 0;
      color: #4f46e5;
      font-size: 1.5rem;
    }

    button {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>ColorMixer Studio</h1>
    <p>تطبيق خلط الألوان شغال بنجاح!</p>
    <button onclick="alert('التطبيق يعمل بشكل ممتاز!')">تجربة التطبيق</button>
  </div>

</body>
</html>
