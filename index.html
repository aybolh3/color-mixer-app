<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlTag">
<head>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Studio de Mélange de Couleurs</title>
  <link rel="stylesheet" href="style.css">
  <script src="cordova.js"></script>
</head>
<body>

  <header>
    <div class="logo" id="appLogo">Studio de Mélange de Couleurs</div>
    <div class="header-controls">
      <div>
        <label style="font-size:0.75rem; color:#64748b; display:block; font-weight:bold;" id="lblLang">Langue / Language:</label>
        <select id="langSelect" onchange="changeLanguage(this.value)">
          <option value="fr" selected>🌐 Français</option>
          <option value="ar">🌐 العربية</option>
          <option value="en">🌐 English</option>
        </select>
      </div>

      <div class="cap-ref-container">
        <div>
          <label style="font-size:0.75rem; color:#64748b; display:block; font-weight:bold;" id="lblUnit">Unité de mesure:</label>
          <select id="unitSelect" onchange="changeUnit(this.value)">
            <option value="caps" id="optCaps" selected>Bouchons (Caps)</option>
            <option value="ml" id="optMl">🧪 Millilitre (ml)</option>
            <option value="g" id="optG">⚖️ Gramme (g)</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div>
      <section class="card">
        <h2 class="card-title" id="titleStep1">1. Sélection de la couleur</h2>
        <div class="preset-grid" id="presetContainer"></div>
        
        <!-- قسم شعار مرسيدس وناتج الخلط -->
        <div style="margin-top: 15px;">
          <label style="font-weight: 600; display: block; margin-bottom: 12px;" id="lblCustomColor">Ou choisissez une couleur personnalisée:</label>
          
          <div class="custom-mixer-wrapper" style="display: flex; gap: 20px; align-items: center; justify-content: center; padding: 10px 0;">
            
            <!-- الدائرة الأولى: مقسمة لـ 3 أجزاء كشعار مرسيدس -->
            <div id="mercedesCircle" class="circle-box" style="width: 140px; height: 140px; border-radius: 50%; border: 3px solid #cbd5e1; position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); background: conic-gradient(#ffffff 0deg 120deg, #ffffff 120deg 240deg, #ffffff 240deg 360deg);">
              
              <!-- محددات الألوان و أزرار المسح -->
              <div style="position: absolute; top: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px;">
                <input type="color" id="mixColor1" value="#ffffff" style="width: 24px; height: 24px; border: none; background: transparent; cursor: pointer;" oninput="updateCustomTripleMix()">
                <button type="button" onclick="clearColor('mixColor1')" style="background: #ef4444; color: white; border: none; border-radius: 50%; width: 14px; height: 14px; font-size: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;">✕</button>
              </div>
              
              <div style="position: absolute; bottom: 20px; left: 18px; display: flex; align-items: center; gap: 2px;">
                <input type="color" id="mixColor2" value="#ffffff" style="width: 24px; height: 24px; border: none; background: transparent; cursor: pointer;" oninput="updateCustomTripleMix()">
                <button type="button" onclick="clearColor('mixColor2')" style="background: #ef4444; color: white; border: none; border-radius: 50%; width: 14px; height: 14px; font-size: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;">✕</button>
              </div>

              <div style="position: absolute; bottom: 20px; right: 18px; display: flex; align-items: center; gap: 2px;">
                <input type="color" id="mixColor3" value="#ffffff" style="width: 24px; height: 24px; border: none; background: transparent; cursor: pointer;" oninput="updateCustomTripleMix()">
                <button type="button" onclick="clearColor('mixColor3')" style="background: #ef4444; color: white; border: none; border-radius: 50%; width: 14px; height: 14px; font-size: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;">✕</button>
              </div>

            </div>

            <span style="font-size: 1.2rem; color: #64748b; font-weight: bold;">➔</span>

            <!-- الدائرة الثانية: النتيجة -->
            <div id="mixResultCircle" class="circle-box output-circle" style="width: 140px; height: 140px; border-radius: 50%; background-color: #e2e8f0; border: 3px solid #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: background-color 0.2s ease;">
              <span style="font-size: 0.85rem; color: #475569; font-weight: bold;">Résultat</span>
            </div>

          </div>
        </div>

        <div class="capture-box">
          <strong style="display: block; margin-bottom: 8px;" id="titleCapture">📷 Capturer la couleur:</strong>
          <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
            <button class="btn btn-secondary" onclick="useEyeDropper()" id="btnEyedropper">👁️ Pipette à écran</button>
            <label class="btn btn-secondary" style="cursor: pointer;">
              <span id="txtUpload">📁 Importer une photo / Caméra</span>
              <input type="file" accept="image/*" capture="environment" id="imageInput" style="display: none;" onchange="handleImageUpload(event)">
            </label>
          </div>
          <canvas id="imageCanvas"></canvas>
          <p id="canvasHelpText" style="font-size: 0.8rem; color: #64748b; margin-top: 6px; display: none;">Cliquez n'importe où sur l'image pour capturer la couleur!</p>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">
          <span id="titleSaved">💾 Recettes enregistrées</span>
        </h2>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
          <input type="text" id="recipeNameInput" placeholder="Nom de la recette..." style="flex: 1;">
          <button class="btn" onclick="saveCurrentRecipe()" id="btnSave">Enregistrer</button>
        </div>
        <div class="saved-list" id="savedListContainer"></div>
      </section>
    </div>

    <div>
      <section class="card">
        <h2 class="card-title">
          <span id="titleStep2">2. Formule de mélange</span>
          <button class="btn btn-secondary" onclick="window.print()" style="font-size: 0.85rem; padding: 4px 10px;" id="btnPrint">🖨️ Imprimer / PDF</button>
        </h2>
        
        <!-- صندوق المعاينة -->
        <div class="preview-box" id="previewBox" style="padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 12px; border: 1px solid #cbd5e1;">
          <span id="previewName">Turquoise</span>
        </div>

        <div class="formula-section" id="formulaContainer"></div>

        <div class="water-ratio-box" style="margin-top: 12px; background: #f0fdf4; padding: 10px; border-radius: 8px; border: 1px solid #bbf7d0;">
          💧 <strong id="lblDilution">Diluant requis:</strong> <span id="waterAmount">~0.5</span> (<span id="lblRatio">Ratio de 15%</span>)
        </div>

        <div class="scale-controls" style="margin-top: 15px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 600;" id="lblBatchScale">Multiplicateur de lot:</span>
            <div style="display: flex; align-items: center; gap: 10px;">
              <button class="btn btn-secondary" onclick="adjustScale(-1)">-</button>
              <span id="scaleFactor" style="font-weight: bold; font-size: 1.1rem;">1x</span>
              <button class="btn btn-secondary" onclick="adjustScale(1)">+</button>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 8px;">
            <label for="literInput" style="font-weight: 600; font-size: 0.9rem;" id="lblLiterInput">Ou volume de lot en Litres (L):</label>
            <input type="number" id="literInput" step="0.1" min="0.1" placeholder="1" style="width: 90px;" oninput="handleLiterInput(this.value)">
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
