<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">استوديو خلط الألوان - مطابق الصبغات</title>
  <!-- ربط ملف التنسيقات CSS -->
  <link rel="stylesheet" href="style.css">
  <script src="cordova.js"></script>
</head>
<body>

  <header>
    <div class="logo" id="appLogo">🎨 استوديو خلط الألوان</div>
    <div class="header-controls">
      <div>
        <label style="font-size:0.75rem; color:#64748b; display:block; font-weight:bold;" id="lblLang">اللغة / Language:</label>
        <select id="langSelect" onchange="changeLanguage(this.value)">
          <option value="ar" selected>🌐 العربية</option>
          <option value="fr">🌐 Français</option>
          <option value="en">🌐 English</option>
        </select>
      </div>

      <div class="cap-ref-container">
        <div>
          <label style="font-size:0.75rem; color:#64748b; display:block; font-weight:bold;" id="lblUnit">وحدة القياس:</label>
          <select id="unitSelect" onchange="changeUnit(this.value)">
            <option value="caps" id="optCaps" selected>🧢 معيار الأغطية (Caps)</option>
            <option value="ml" id="optMl">🧪 ملليلتر (ml)</option>
            <option value="g" id="optG">⚖️ غرام (g)</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div>
      <section class="card">
        <h2 class="card-title" id="titleStep1">١. اختيار اللون المطلوب</h2>
        <div class="preset-grid" id="presetContainer"></div>
        <div style="margin-top: 10px;">
          <label for="customPicker" style="font-weight: 600; display: block; margin-bottom: 8px;" id="lblCustomColor">أو اختر درجة مخصصة:</label>
          <input type="color" id="customPicker" value="#40e0d0" style="width: 100%; height: 40px; border-radius: 8px; border: none; cursor: pointer;" oninput="handleCustomColor(this.value)">
        </div>

        <div class="capture-box">
          <strong style="display: block; margin-bottom: 8px;" id="titleCapture">📷 التقاط لون المادة:</strong>
          <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
            <button class="btn btn-secondary" onclick="useEyeDropper()" id="btnEyedropper">👁️ أداة التقاط اللون</button>
            <label class="btn btn-secondary" style="cursor: pointer;">
              <span id="txtUpload">📁 رفع صورة / التقاط</span>
              <input type="file" accept="image/*" capture="environment" id="imageInput" style="display: none;" onchange="handleImageUpload(event)">
            </label>
          </div>
          <canvas id="imageCanvas"></canvas>
          <p id="canvasHelpText" style="font-size: 0.8rem; color: #64748b; margin-top: 6px; display: none;">انقر في أي مكان على الصورة لالتقاط لون الصبغة بالضبط!</p>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">
          <span id="titleSaved">💾 الوصفات المحفوظة</span>
        </h2>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
          <input type="text" id="recipeNameInput" placeholder="اسم الوصفة..." style="flex: 1;">
          <button class="btn" onclick="saveCurrentRecipe()" id="btnSave">حفظ</button>
        </div>
        <div class="saved-list" id="savedListContainer"></div>

        <div style="display: flex; gap: 8px; margin-top: 15px; padding-top: 10px; border-top: 1px solid #e2e8f0;">
          <button class="btn btn-secondary" style="flex: 1; font-size: 0.8rem;" onclick="exportRecipes()">📥 تصدير البيانات (JSON)</button>
          <label class="btn btn-secondary" style="flex: 1; font-size: 0.8rem; cursor: pointer; text-align: center;">
            📤 استيراد بيانات
            <input type="file" accept=".json" style="display: none;" onchange="importRecipes(event)">
          </label>
        </div>
      </section>
    </div>

    <div>
      <section class="card">
        <h2 class="card-title">
          <span id="titleStep2">٢. وصفة القياس والخلط</span>
          <button class="btn btn-secondary" onclick="window.print()" style="font-size: 0.85rem; padding: 4px 10px;" id="btnPrint">🖨️ طباعة / PDF</button>
        </h2>
        
        <div class="preview-box" id="previewBox">
          <span id="previewName">🧢 تركواز</span>
        </div>

        <div class="formula-section" id="formulaContainer"></div>

        <div class="water-ratio-box">
          💧 <strong id="lblDilution">المخفف / المذيب المطلوب:</strong> <span id="waterAmount">~0.5 أغطية 🧢</span> (<span id="lblRatio">نسبة ١٥٪</span>)
        </div>

        <div class="scale-controls">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 600;" id="lblBatchScale">مضاعف الخلطة:</span>
            <div style="display: flex; align-items: center; gap: 10px;">
              <button class="btn btn-secondary" onclick="adjustScale(-1)">-</button>
              <span id="scaleFactor" style="font-weight: bold; font-size: 1.1rem;">1x</span>
              <button class="btn btn-secondary" onclick="adjustScale(1)">+</button>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 5px;">
            <label for="literInput" style="font-weight: 600; font-size: 0.9rem;" id="lblLiterInput">أو حدد حجم الدفعة باللتر (L):</label>
            <input type="number" id="literInput" step="0.1" min="0.1" placeholder="1" style="width: 90px;" oninput="handleLiterInput(this.value)">
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- ربط ملف الجافاسكريبت JS -->
  <script src="script.js"></script>
</body>
</html>
