<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">استوديو خلط الألوان - مطابق الصبغات</title>
  <link rel="stylesheet" href="style.css">
  <script src="cordova.js"></script>
</head>
<body>

  <header>
    <div class="logo" id="appLogo">🎨 استوديو خلط الألوان</div>
    <div class="header-controls">
      <div>
        <label style="font-size:0.75rem; color:#64748b; display:block; font-weight:bold;" id="lblLang">اللغة / Language:</label>
        <select id="langSelect" onchange="changeLanguage(this.value)">
          <option value="ar" selected>🌐 العربية</option>
          <option value="fr">🌐 Français</option>
          <option value="en">🌐 English</option>
        </select>
      </div>

      <div class="cap-ref-container">
        <div>
          <label style="font-size:0.75rem; color:#64748b; display:block; font-weight:bold;" id="lblUnit">وحدة القياس:</label>
          <select id="unitSelect" onchange="changeUnit(this.value)">
            <option value="caps" id="optCaps" selected>🧢 معيار الأغطية (Caps)</option>
            <option value="ml" id="optMl">🧪 ملليلتر (ml)</option>
            <option value="g" id="optG">⚖️ غرام (g)</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div>
      <section class="card">
        <h2 class="card-title" id="titleStep1">١. اختيار اللون المطلوب</h2>
        <div class="preset-grid" id="presetContainer"></div>
        
        <!-- قسم خلط 3 ألوان مع أزرار الحذف والمعاينة -->
        <div style="margin-top: 15px;">
          <label style="font-weight: 600; display: block; margin-bottom: 12px;" id="lblCustomColor">أو اختر درجة مخصصة (خلط 3 ألوان):</label>
          
          <div class="custom-mixer-wrapper" style="display: flex; gap: 15px; align-items: center; justify-content: center; padding: 10px 0;">
            <!-- الدائرة الأولى: اختيار الألوان مع أزرار المسح -->
            <div class="circle-box input-circle" style="width: 140px; height: 140px; border-radius: 50%; background: #f1f5f9; border: 2px dashed #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
              <span style="font-size: 0.75rem; color: #475569; font-weight: bold;">اختر 3 ألوان</span>
              <div style="display: flex; gap: 6px; align-items: center;">
                
                <div style="position: relative;">
                  <input type="color" id="mixColor1" value="#ff0000" style="width: 28px; height: 28px; border: none; background: none; cursor: pointer;" oninput="updateCustomTripleMix()">
                  <button type="button" onclick="clearColor('mixColor1')" style="position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 15px; height: 15px; font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;">✕</button>
                </div>
                
                <div style="position: relative;">
                  <input type="color" id="mixColor2" value="#00ff00" style="width: 28px; height: 28px; border: none; background: none; cursor: pointer;" oninput="updateCustomTripleMix()">
                  <button type="button" onclick="clearColor('mixColor2')" style="position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 15px; height: 15px; font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;">✕</button>
                </div>

                <div style="position: relative;">
                  <input type="color" id="mixColor3" value="#0000ff" style="width: 28px; height: 28px; border: none; background: none; cursor: pointer;" oninput="updateCustomTripleMix()">
                  <button type="button" onclick="clearColor('mixColor3')" style="position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 15px; height: 15px; font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;">✕</button>
                </div>

              </div>
            </div>

            <span style="font-size: 1.2rem; color: #64748b; font-weight: bold;">➔</span>

            <!-- الدائرة الثانية: النتيجة -->
            <div id="mixResultCircle" class="circle-box output-circle" style="width: 140px; height: 140px; border-radius: 50%; background-color: #808080; border: 3px solid #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: background-color 0.2s ease;">
              <span style="font-size: 0.85rem; color: #ffffff; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">النتيجة</span>
            </div>
          </div>
        </div>

        <div class="capture-box">
          <strong style="display: block; margin-bottom: 8px;" id="titleCapture">📷 التقاط لون المادة:</strong>
          <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
            <button class="btn btn-secondary" onclick="useEyeDropper()" id="btnEyedropper">👁️ أداة التقاط اللون</button>
            <label class="btn btn-secondary" style="cursor: pointer;">
              <span id="txtUpload">📁 رفع صورة / التقاط</span>
              <input type="file" accept="image/*" capture="environment" id="imageInput" style="display: none;" onchange="handleImageUpload(event)">
            </label>
          </div>
          <canvas id="imageCanvas"></canvas>
          <p id="canvasHelpText" style="font-size: 0.8rem; color: #64748b; margin-top: 6px; display: none;">انقر في أي مكان على الصورة لالتقاط لون الصبغة بالضبط!</p>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">
          <span id="titleSaved">💾 الوصفات المحفوظة</span>
        </h2>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
          <input type="text" id="recipeNameInput" placeholder="اسم الوصفة..." style="flex: 1;">
          <button class="btn" onclick="saveCurrentRecipe()" id="btnSave">حفظ</button>
        </div>
        <div class="saved-list" id="savedListContainer"></div>

        <div style="display: flex; gap: 8px; margin-top: 15px; padding-top: 10px; border-top: 1px solid #e2e8f0;">
          <button class="btn btn-secondary" style="flex: 1; font-size: 0.8rem;" onclick="exportRecipes()" id="btnExport">📥 تصدير البيانات (JSON)</button>
          <label class="btn btn-secondary" style="flex: 1; font-size: 0.8rem; cursor: pointer; text-align: center;" id="lblImport">
            📤 استيراد بيانات
            <input type="file" accept=".json" style="display: none;" onchange="importRecipes(event)">
          </label>
        </div>
      </section>
    </div>

    <div>
      <section class="card">
        <h2 class="card-title">
          <span id="titleStep2">٢. وصفة القياس والخلط</span>
          <button class="btn btn-secondary" onclick="window.print()" style="font-size: 0.85rem; padding: 4px 10px;" id="btnPrint">🖨️ طباعة / PDF</button>
        </h2>
        
        <div class="preview-box" id="previewBox" style="padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 12px; border: 1px solid #cbd5e1;">
          <span id="previewName"> تركواز</span>
        </div>

        <div class="formula-section" id="formulaContainer"></div>

        <div class="water-ratio-box" style="margin-top: 12px; background: #f0fdf4; padding: 10px; border-radius: 8px; border: 1px solid #bbf7d0;">
          💧 <strong id="lblDilution">المخفف / المذيب المطلوب:</strong> <span id="waterAmount">~0.5 أغطية 🧢</span> (<span id="lblRatio">نسبة ١٥٪</span>)
        </div>

        <div class="scale-controls" style="margin-top: 15px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 600;" id="lblBatchScale">مضاعف الخلطة:</span>
            <div style="display: flex; align-items: center; gap: 10px;">
              <button class="btn btn-secondary" onclick="adjustScale(-1)">-</button>
              <span id="scaleFactor" style="font-weight: bold; font-size: 1.1rem;">1x</span>
              <button class="btn btn-secondary" onclick="adjustScale(1)">+</button>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 8px;">
            <label for="literInput" style="font-weight: 600; font-size: 0.9rem;" id="lblLiterInput">أو حدد حجم الدفعة باللتر (L):</label>
            <input type="number" id="literInput" step="0.1" min="0.1" placeholder="1" style="width: 90px;" oninput="handleLiterInput(this.value)">
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
