name: Build Android Signed AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Cordova Project Structure
        run: |
          mkdir -p www
          cp -r index.html script.js style.css manifest.json sw.js icon.png www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true

      - name: Add Android Platform & Build AAB
        run: |
          cordova platform add android
          cordova build android --release -- --packageType=bundle

      - name: Generate Keystore & Sign AAB
        run: |
          keytool -genkey -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass mypassword -keypass mypassword -dname "CN=Ayoub, OU=Dev, O=App, L=City, S=State, C=MA"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass mypassword platforms/android/app/build/outputs/bundle/release/app-release.aab releasekey

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-aab
          path: platforms/android/app/build/outputs/bundle/release/app-release.aab
