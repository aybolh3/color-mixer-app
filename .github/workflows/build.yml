name: Build and Sign Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Dependencies
        run: npm install

      # إزالة المنصة وإعادتها لتجنب تعارض الكاش وكود 254
      - name: Prepare Android Platform
        run: |
          cordova platform remove android || true
          cordova platform add android@latest

      # بناء ملف Release APK
      - name: Build Android Release APK
        run: cordova build android --release -- --extra-args="--no-daemon"

      # توقيع التطبيق
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: platforms/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # رفع الملف الناتج
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorMixStudio-Release-Signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
