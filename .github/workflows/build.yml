name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova CLI
        run: npm install -g cordova@12.0.0

      - name: Build Cordova Project
        env:
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
        run: |
          cordova create cordova_app com.aybolh3.colormixer "ColorMixer"
          cd cordova_app
          rm -rf www/*
          cp -r ../index.html www/
          if [ -d "../AppIcons" ]; then cp -r ../AppIcons www/ 2>/dev/null || true; fi
          cordova platform add android@12.0.0
          cordova build android --debug --no-telemetry

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorMixer-APK
          path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
