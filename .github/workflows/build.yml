name: Build and Sign Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova@12.0.0

      - name: Install Project Dependencies
        run: npm install

      - name: Prepare Android Platform
        run: |
          cordova platform remove android --nosave || true
          cordova platform add android@12.0.0 --nosave

      # إعداد إذن التشغيل لـ Gradle الباني الداخلي
      - name: Set Executable Permissions for Gradle
        run: |
          chmod +x platforms/android/gradlew || true

      # البناء مع زيادة الـ Memory وتفادي تعارض الـ Daemon
      - name: Build Android Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
        run: cordova build android --release

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: platforms/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorMixStudio-Release-Signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
