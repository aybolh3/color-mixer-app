name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build & Sign APK Automatically
        run: |
          npm install -g cordova
          
          # مسح المجلدات القديمة لإعادة البناء بنظافة
          rm -rf platforms/android
          
          cordova platform add android@13.0.0 --skip-link
          cordova prepare android
          
          # بناء APK بدون تقسيم المعالجات
          cordova build android --debug -- --gradleArg=-PcdvBuildMultipleApks=false

          # إنتاج مفتاح توقيع مؤقت وتثبيته
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BUILD_TOOLS/zipalign -v -p 4 platforms/android/app/build/outputs/apk/debug/app-debug.apk ColorMixer-Signed.apk
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey ColorMixer-Signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorMixer-APK-Signed
          path: 'ColorMixer-Signed.apk'
