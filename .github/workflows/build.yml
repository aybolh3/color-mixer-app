name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK using Cordova
        run: |
          npm install -g cordova
          cordova create app com.colormixer.app ColorMixer
          cd app
          rm -rf www/*
          cp -r ../index.html ../style.css ../script.js ../icon.png www/ 2>/dev/null || cp -r ../* www/ || true
          cordova platform add android
          cordova build android --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorMixer-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
