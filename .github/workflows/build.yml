name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '24'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.1

      - name: Install Cordova & Build App
        run: |
          npm install -g cordova
          cordova create tmp_app com.aybolh3.colormixer ColorMixer
          cp -r www/* tmp_app/www/
          cd tmp_app
          cordova platform add android
          cordova build android --debug
          mkdir -p ../output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../output/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: app-debug-apk
          path: output/app-debug.apk
