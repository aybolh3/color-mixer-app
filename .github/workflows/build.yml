name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '24'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.1

      - name: Install Cordova & Build App
        run: |
          npm install -g cordova
          
          # إنشاء مجلد مشروع Cordova مؤقت
          mkdir build_env
          cd build_env
          cordova create tmp_app com.aybolh3.colormixer ColorMixer
          
          # نقل ملفات تطبيقك
          cp -r ../www/* tmp_app/www/
          cp ../config.xml tmp_app/config.xml
          cp -r ../mipmap-* tmp_app/ 2>/dev/null || true
          
          # إعداد منصة الأندرويد والبناء
          cd tmp_app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.6.1
      - name: Upload APK
        uses: actions/upload-artifact@v4
          name: ColorMixer-APK
          path: build_env/tmp_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
         
