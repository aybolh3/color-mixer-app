name: Build and Sign Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد البيئة (Node.js & Java 17)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 3. قبول رخص Android SDK تلقائياً لتفادي فشل البناء
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 4. تثبيت الاعتمادات وإضافة منصة Android
      - name: Install Dependencies
        run: |
          npm install
          npx cordova platform add android || true

      # 5. بناء الـ APK (Release)
      - name: Build Android App (Release)
        run: npx cordova build android --release

      # 6. توقيع ملف الـ APK
      - name: Sign Android APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: platforms/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # 7. رفع الـ APK الموقّع
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-App-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
